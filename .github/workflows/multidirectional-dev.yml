name: multidirectional implementation verification
on:
  push:
    branches: [feat/multidirectional-shell-fatigue]
    paths:
      - .github/workflows/multidirectional-dev.yml
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/multidirectional-shell-fatigue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply the locally verified integration patch
        run: |
          git apply --check --index .github/multidirectional-integration.patch
          git apply --index .github/multidirectional-integration.patch
      - name: Verify all changed files match the tested source
        run: |
          sha256sum --check <<'MANIFEST'
          28c3daac4f2e9015aaacf0076388a67b28b25a029b1d09e8a5c5452ce21f2417  CHANGELOG.md
          e524d60f1762885c50136eae467eb9a319e902925060aef76e9c7bf6861dc0d3  README.md
          c2e333e9488f10a1ede2445acc7417fa3dbbd913ac0c0b14bc3daaf49c8aa26d  docs/DESIGN.md
          42385d14e6f1dfe68b7299fa0c19f507a9819cbc04fe9552058974d3b4379924  docs/MULTIDIRECTIONAL.md
          df7b7c900ae85293a063a0327066985cccffebd89833873183f9580c22603571  src/anyfatigue/__init__.py
          f009909db1fa8baf3ae38eb565b2e7d7e5b0366d4f19ed2878af13c21f29506e  src/anyfatigue/gui/window.py
          204980cce3740983ea44d13134bac8e1d03204c2ebd0f59f7a4c76034f45196b  src/anyfatigue/multidirectional.py
          eb77b668ee744e11f7f22437b2aac5637892fdc960c129220562469994857209  src/anyfatigue/plotdata.py
          03b90a25722dafa36b4f8e8906cd65a56002ec75bda55b2b8549e1e75c00298d  src/anyfatigue/report.py
          34c4d8be612b20a047e3875abb1b23cd1f5e6f8ac7dd33ce39df0353f608d615  src/anyfatigue/results.py
          98fddbe509ebaccc59ccfcb9867b8416b004c24a2fca34348faef20629376dc7  src/anyfatigue/timeseries.py
          bdac9f538a99e0964f5b2aaad66e079a2a88b73829f5ed7a762463741edad9a8  tests/test_gui.py
          8adc858c74b35982c86fa9298384154b4c018b5efa4782ffb2a3c5aaf2f92c85  tests/test_multidirectional.py
          MANIFEST
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q -rs --junitxml="$RUNNER_TEMP/multidirectional-tests.xml"
      - name: Commit verified integration and remove temporary workflow
        run: |
          git rm .github/multidirectional-integration.patch .github/workflows/multidirectional-dev.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate multidirectional shell assessment after source-hash and regression checks'
          git push origin HEAD:refs/heads/feat/multidirectional-shell-fatigue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multidirectional-regression-evidence
          path: ${{ runner.temp }}/multidirectional-tests.xml
          retention-days: 3
