name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PySide6 needs these system libraries on a bare Linux runner (as in ANYfem's Qt workflow).
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Install ANYfatigue with its GUI and test dependencies
        run: python -m pip install -e ".[gui,dev]"
      # ANYfem-marked tests skip themselves when the producer stack is absent.
      # They are exercised on developer workstations until the ANYfem stack can be
      # installed from published packages in CI (see docs/DESIGN.md, open items).
      - name: Run the tests (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs
