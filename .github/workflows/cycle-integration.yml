name: cycle-associated integration
on:
  push:
    branches: [feat/cycle-associated-shear]
    paths: [.github/workflows/cycle-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/cycle-associated-shear'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt test system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Apply tested source patches
        run: |
          # Normalize one known transfer-only diff-header leading space.
          sed -i 's/^ diff --git /diff --git /' .github/fatigue-tests.patch
          git apply --check --index .github/fatigue-core.patch .github/fatigue-tests.patch .github/fatigue-docs.patch
          git apply --index .github/fatigue-core.patch .github/fatigue-tests.patch .github/fatigue-docs.patch
      - name: Install consumer and exact indexed owner
        run: |
          python -m pip install -e '.[gui,dev]'
          python -m pip install --no-deps --force-reinstall -r requirements-indexed.txt
      - name: Test full combined source
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs --junitxml="$RUNNER_TEMP/cycle-tests.xml"
      - name: Verify exact tested tree and commit branch
        run: |
          git rm -f .github/fatigue-core.patch .github/fatigue-tests.patch .github/fatigue-docs.patch .github/workflows/cycle-integration.yml
          git diff --cached --check
          test "$(git write-tree)" = '5c339e6a033c162b0fbc99781a0ba141d048837d'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate cycle-associated fatigue after full regression and exact-tree verification'
          git push origin HEAD:refs/heads/feat/cycle-associated-shear
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-associated-integration-evidence
          path: ${{ runner.temp }}/cycle-tests.xml
          retention-days: 3
