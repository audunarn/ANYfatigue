[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYfatigue"
version = "0.1.0"
description = "Fatigue assessment to DNV rules: simplified (Weibull) and rainflow/time-series methods on ANYfem stresses"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [
  { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  # Rainflow counting is owned by ANYtimeseries (ECOSYSTEM_GUIDE section 1);
  # ANYfatigue consumes anyqats.fatigue.rainflow rather than copying it.
  "anytimes>=1.1,<2",
]

[project.optional-dependencies]
# ANYfem is a producer of stresses, never a requirement of the fatigue core.
anyfem = [
  "ANYfem>=0.4,<0.5",
  "h5py>=3.15,<4",
]
gui = [
  "PySide6>=6.10.1,<6.11",
]
dev = [
  "pytest>=8",
  "build>=1.2",
]

# A GUI entry point so no console window opens alongside the application.
[project.gui-scripts]
anyfatigue-gui = "anyfatigue.gui:main"

[project.scripts]
anyfatigue = "anyfatigue.cli:main"

[project.urls]
Homepage = "https://github.com/audunarn/ANYfatigue"
Repository = "https://github.com/audunarn/ANYfatigue"
Issues = "https://github.com/audunarn/ANYfatigue/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["anyfatigue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = [
  "anyfem: needs the ANYfem producer packages (skipped when they are not importable)",
  "qt: needs PySide6 and runs offscreen",
]
